name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify check.mjs parses
        run: node --check check.mjs
      - name: Verify missing-key error is helpful
        env:
          FASTLY_KEY: ""
        run: |
          set +e
          OUT=$(node check.mjs google.com 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          [ $CODE -ne 0 ] || (echo "expected non-zero exit when FASTLY_KEY unset" && exit 1)
          echo "$OUT" | grep -q "FASTLY_KEY not set" || (echo "missing-key error message changed" && exit 1)
          echo "$OUT" | grep -q "manage.fastly.com" || (echo "missing-key error must include token URL" && exit 1)
